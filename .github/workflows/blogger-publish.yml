name: Blogger - Publish

on:
  workflow_dispatch:
    inputs:
      item:
        description: "Optional single Post: story/<slug> or notice/<slug>"
        required: false
        default: ""
        type: string
      dry_run:
        description: 'Resolve targets without changing Blogger'
        required: false
        default: true
        type: boolean
  pull_request:
    branches: [develop, main]
    paths:
      - 'blogger/**'
      - 'scripts/blogger_*.py'
      - '.github/workflows/blogger-publish.yml'
      - '.github/workflows/blogger-generate-draft.yml'
      - '.github/workflows/blogger-translate.yml'
  push:
    branches: [main]
    paths:
      - 'blogger/**'
      - 'scripts/blogger_sync.py'
      - 'scripts/blogger_sync_draft.py'
      - 'scripts/blogger_ensure_pages.py'
      - 'scripts/blogger_generate.py'
      - 'scripts/blogger_validate.py'
      - 'scripts/blogger_validate_guide.py'
      - 'scripts/blogger_validate_page_metadata.py'
      - 'scripts/blogger_validate_post.py'
      - 'scripts/blogger_build_theme.py'
      - 'scripts/blogger_validate_theme_runtime.py'
      - 'scripts/blogger_validate_theme_xml.py'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Blogger Python scripts
        run: python -m py_compile scripts/blogger_*.py

      - name: Test localized Post overrides
        run: python -m unittest discover -s scripts -p 'test_blogger_localized*.py'

      - name: Test production scope and store links
        run: |
          python -m unittest discover -s scripts -p 'test_blogger_publish_scope.py'
          python -m unittest discover -s scripts -p 'test_blogger_store_links.py'

      - name: Validate Blogger theme runtime
        run: |
          python scripts/blogger_validate_theme_runtime.py
          python scripts/blogger_validate_theme_xml.py

      - name: Require all FAQ locales
        shell: bash
        run: |
          set -euo pipefail
          locales="$(python -c 'import json; print(" ".join(json.load(open("blogger/config.json", encoding="utf-8"))["locales"].keys()))')"
          for locale in $locales; do
            test -f "blogger/faq/${locale}.html" || { echo "Missing blogger/faq/${locale}.html"; exit 1; }
          done

      - name: Validate FAQ HTML
        run: python scripts/blogger_validate.py blogger/faq/*.html

      - name: Validate Guide search descriptions
        run: python scripts/blogger_validate_page_metadata.py guide --show

      - name: Validate Guide HTML when enabled
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f blogger/guide/ko.html ]]; then
            locales="$(python -c 'import json; print(" ".join(json.load(open("blogger/config.json", encoding="utf-8"))["locales"].keys()))')"
            for locale in $locales; do
              test -f "blogger/guide/${locale}.html" || { echo "Missing blogger/guide/${locale}.html"; exit 1; }
            done
            python scripts/blogger_validate_guide.py blogger/guide/*.html
          else
            echo "Guide source not present; Guide Page publish is disabled."
          fi

      - name: Check FAQ/Guide release freshness
        run: |
          python scripts/blogger_content_freshness.py
          python -m unittest discover -s scripts -p 'test_blogger_content_freshness.py'

      - name: Validate managed Posts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' meta; do
            item="$(dirname "$meta")"
            python scripts/blogger_validate_post.py "$item" --all-locales
          done < <(find blogger/posts -mindepth 3 -maxdepth 3 -name meta.json -print0 2>/dev/null || true)

      - name: Check Blogger credentials
        if: github.event_name != 'pull_request'
        id: creds
        shell: bash
        run: |
          if [[ -z "${BLOGGER_CLIENT_ID}" || -z "${BLOGGER_CLIENT_SECRET}" || -z "${BLOGGER_REFRESH_TOKEN}" ]]; then
            echo "::notice::Blogger OAuth secrets are not configured. Publish skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve publication scope
        if: steps.creds.outputs.ready == 'true'
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
          REQUESTED_ITEM: ${{ inputs.item }}
        run: python scripts/blogger_publish_scope.py

      - name: Blogger dry run for selected targets
        if: steps.creds.outputs.ready == 'true'
        env:
          SYNC_PAGES: ${{ steps.scope.outputs.pages }}
          SYNC_POSTS: ${{ steps.scope.outputs.posts }}
          POSTS_ROOT: ${{ steps.scope.outputs.posts_root }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SYNC_PAGES" == "true" ]]; then
            python scripts/blogger_ensure_pages.py --dry-run
            python scripts/blogger_sync.py pages --dry-run
          fi
          if [[ "$SYNC_POSTS" == "true" ]]; then
            python scripts/blogger_sync.py posts --posts-root "$POSTS_ROOT" --dry-run
          fi

      - name: Publish selected Blogger targets
        if: >-
          steps.creds.outputs.ready == 'true' &&
          (
            github.event_name == 'push' ||
            (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
          )
        env:
          SYNC_PAGES: ${{ steps.scope.outputs.pages }}
          SYNC_POSTS: ${{ steps.scope.outputs.posts }}
          POSTS_ROOT: ${{ steps.scope.outputs.posts_root }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SYNC_PAGES" == "true" ]]; then
            python scripts/blogger_ensure_pages.py
            python scripts/blogger_sync.py pages
          fi
          if [[ "$SYNC_POSTS" == "true" ]]; then
            python scripts/blogger_sync.py posts --posts-root "$POSTS_ROOT"
          fi
