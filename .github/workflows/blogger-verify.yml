name: Blogger - Verify

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'blogger/**'
      - 'scripts/blogger_sync.py'
      - 'scripts/blogger_ensure_pages.py'
      - 'scripts/blogger_validate.py'
      - 'scripts/blogger_validate_guide.py'
      - 'scripts/blogger_validate_page_metadata.py'
      - '.github/workflows/blogger-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Blogger Python scripts
        run: python -m py_compile scripts/blogger_*.py

      - name: Validate repository content
        shell: bash
        run: |
          set -euo pipefail
          python scripts/blogger_validate_page_metadata.py guide

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python scripts/blogger_validate.py blogger/faq/*.html
            if [[ -f blogger/guide/ko.html ]]; then
              locales="$(python -c 'import json; print(" ".join(json.load(open("blogger/config.json", encoding="utf-8"))["locales"].keys()))')"
              for locale in $locales; do
                test -f "blogger/guide/${locale}.html" || { echo "Missing blogger/guide/${locale}.html"; exit 1; }
              done
              python scripts/blogger_validate_guide.py blogger/guide/*.html
            fi
          else
            # Translation runs in parallel on develop pushes. Validate the Korean
            # sources here and let Blogger - Translate validate all localized files
            # after it finishes generating them.
            python scripts/blogger_validate.py blogger/faq/ko.html
            if [[ -f blogger/guide/ko.html ]]; then
              python scripts/blogger_validate_guide.py blogger/guide/ko.html
            fi
          fi

      - name: Require Blogger credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BLOGGER_CLIENT_ID}" || { echo "Missing BLOGGER_CLIENT_ID"; exit 1; }
          test -n "${BLOGGER_CLIENT_SECRET}" || { echo "Missing BLOGGER_CLIENT_SECRET"; exit 1; }
          test -n "${BLOGGER_REFRESH_TOKEN}" || { echo "Missing BLOGGER_REFRESH_TOKEN"; exit 1; }

      - name: Discover Blogger targets
        run: python scripts/blogger_sync.py discover

      - name: Verify Pages without writing
        run: python scripts/blogger_ensure_pages.py --dry-run

      - name: Verify Posts without writing
        run: python scripts/blogger_sync.py posts --dry-run
