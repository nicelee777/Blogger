name: Blogger - Translate

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Content to translate'
        required: true
        default: all
        type: choice
        options:
          - all
          - faq
          - guide
          - posts

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_TRANSLATION_MODEL: gpt-5.6-luna
      TRANSLATION_SCOPE: ${{ inputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require OpenAI credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY}" || { echo "Missing OPENAI_API_KEY"; exit 1; }

      - name: Translate requested content
        shell: bash
        run: |
          set -euo pipefail

          case "$TRANSLATION_SCOPE" in
            all)
              translate_faq=true
              translate_guide=true
              translate_posts=true
              ;;
            faq)
              translate_faq=true
              translate_guide=false
              translate_posts=false
              ;;
            guide)
              translate_faq=false
              translate_guide=true
              translate_posts=false
              ;;
            posts)
              translate_faq=false
              translate_guide=false
              translate_posts=true
              ;;
            *)
              echo "Unknown scope: $TRANSLATION_SCOPE" >&2
              exit 2
              ;;
          esac

          if [[ "$translate_faq" == "true" ]]; then
            python scripts/blogger_validate.py blogger/faq/ko.html
            python scripts/blogger_translate.py --content-type faq
          else
            echo "FAQ translation skipped by scope."
          fi

          if [[ "$translate_guide" == "true" ]]; then
            if [[ -f blogger/guide/ko.html ]]; then
              python scripts/blogger_translate.py --content-type guide
            else
              echo "Guide source not present; Guide translation skipped."
            fi
          else
            echo "Guide translation skipped by scope."
          fi

          if [[ "$translate_posts" == "true" ]]; then
            python scripts/blogger_translate_posts.py
          else
            echo "Notice/Story translation skipped by scope."
          fi

          python scripts/blogger_validate.py blogger/faq/*.html
          if [[ -f blogger/guide/ko.html ]]; then
            python scripts/blogger_validate_guide.py blogger/guide/*.html
          fi

          while IFS= read -r -d '' meta; do
            item="$(dirname "$meta")"
            python scripts/blogger_validate_post.py "$item" --all-locales
          done < <(find blogger/posts -mindepth 3 -maxdepth 3 -name meta.json -print0 2>/dev/null || true)

          if [[ -z "$(git status --porcelain -- blogger)" ]]; then
            echo "No translation changes."
          else
            git config user.name "shiftmate-blogger-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add blogger/faq blogger/guide blogger/posts
            git commit -m "chore(blogger): update localized content"
            git pull --rebase origin develop
            git push origin HEAD:develop
          fi
