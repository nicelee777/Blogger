name: Blogger - Translate

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Content to translate'
        required: true
        default: all
        type: choice
        options:
          - all
          - faq
          - guide
          - posts
  push:
    branches: [develop]
    paths:
      - 'blogger/faq/ko.html'
      - 'blogger/guide/ko.html'
      - 'blogger/posts/**/ko.html'
      - 'blogger/posts/**/meta.json'
      - 'blogger/config.json'
      - 'blogger/glossary.json'
      - 'blogger/glossary-overrides.json'
      - 'blogger/editorial-policy.md'
      - 'blogger/seo-policy.md'
      - 'blogger/product-facts.md'
      - 'blogger/content-prompts/**'
      - 'scripts/blogger_apply_glossary_overrides.py'
      - 'scripts/blogger_translate.py'
      - 'scripts/blogger_normalize_spacing.py'
      - 'scripts/blogger_translate_posts.py'
      - 'scripts/blogger_validate.py'
      - 'scripts/blogger_validate_guide.py'
      - 'scripts/blogger_validate_post.py'
      - 'scripts/blogger_sync_draft.py'
      - '.github/workflows/blogger-translate.yml'

concurrency:
  group: blogger-translate-develop
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_TRANSLATION_MODEL: gpt-5.6-luna
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine translation targets
        id: targets
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            scope="${{ inputs.scope }}"
            case "$scope" in
              all) faq=true; guide=true; posts_all=true ;;
              faq) faq=true; guide=false; posts_all=false ;;
              guide) faq=false; guide=true; posts_all=false ;;
              posts) faq=false; guide=false; posts_all=true ;;
              *) echo "Unknown scope: $scope" >&2; exit 2 ;;
            esac
            echo "faq=$faq" >> "$GITHUB_OUTPUT"
            echo "guide=$guide" >> "$GITHUB_OUTPUT"
            echo "posts_all=$posts_all" >> "$GITHUB_OUTPUT"
            echo "posts_changed=false" >> "$GITHUB_OUTPUT"
            echo "before=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            before="$(git rev-parse HEAD^)"
          fi
          current="${{ github.sha }}"
          changed="$(git diff --name-only "$before" "$current")"

          echo "Changed files:"
          printf '%s\n' "$changed"

          faq=false
          guide=false
          posts_all=false
          posts_changed=false

          if printf '%s\n' "$changed" | grep -Eq '^(blogger/config\.json|blogger/glossary\.json|blogger/glossary-overrides\.json|scripts/blogger_apply_glossary_overrides\.py|scripts/blogger_translate\.py|scripts/blogger_normalize_spacing\.py)$'; then
            faq=true
            guide=true
            posts_all=true
          else
            if printf '%s\n' "$changed" | grep -Eq '^blogger/faq/ko\.html$'; then
              faq=true
            fi
            if printf '%s\n' "$changed" | grep -Eq '^(blogger/guide/ko\.html|scripts/blogger_validate_guide\.py|\.github/workflows/blogger-translate\.yml)$'; then
              guide=true
            fi
            if printf '%s\n' "$changed" | grep -Eq '^(blogger/editorial-policy\.md|blogger/seo-policy\.md|blogger/product-facts\.md|blogger/content-prompts/|scripts/blogger_translate_posts\.py)'; then
              posts_all=true
            elif printf '%s\n' "$changed" | grep -Eq '^blogger/posts/[^/]+/[^/]+/(ko\.html|meta\.json)$'; then
              posts_changed=true
            fi
          fi

          echo "faq=$faq" >> "$GITHUB_OUTPUT"
          echo "guide=$guide" >> "$GITHUB_OUTPUT"
          echo "posts_all=$posts_all" >> "$GITHUB_OUTPUT"
          echo "posts_changed=$posts_changed" >> "$GITHUB_OUTPUT"
          echo "before=$before" >> "$GITHUB_OUTPUT"

      - name: Translate changed content
        shell: bash
        env:
          TRANSLATE_FAQ: ${{ steps.targets.outputs.faq }}
          TRANSLATE_GUIDE: ${{ steps.targets.outputs.guide }}
          TRANSLATE_POSTS_ALL: ${{ steps.targets.outputs.posts_all }}
          TRANSLATE_POSTS_CHANGED: ${{ steps.targets.outputs.posts_changed }}
          BEFORE_SHA: ${{ steps.targets.outputs.before }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY}" ]]; then
            echo "::notice::OPENAI_API_KEY is not configured. Translation skipped."
            exit 0
          fi

          cp blogger/glossary.json /tmp/shiftmate-glossary.json
          trap 'cp /tmp/shiftmate-glossary.json blogger/glossary.json' EXIT
          python scripts/blogger_apply_glossary_overrides.py

          if [[ "$TRANSLATE_FAQ" == "true" ]]; then
            python scripts/blogger_validate.py blogger/faq/ko.html
            python scripts/blogger_translate.py --content-type faq
          else
            echo "FAQ source unchanged; translation skipped."
          fi

          if [[ "$TRANSLATE_GUIDE" == "true" ]]; then
            if [[ -f blogger/guide/ko.html ]]; then
              python scripts/blogger_translate.py --content-type guide
            else
              echo "Guide source not present; Guide translation skipped."
            fi
          else
            echo "Guide source unchanged; translation skipped."
          fi

          if [[ "$TRANSLATE_POSTS_ALL" == "true" ]]; then
            python scripts/blogger_translate_posts.py
          elif [[ "$TRANSLATE_POSTS_CHANGED" == "true" ]]; then
            current="${{ github.sha }}"
            git diff --name-only "$BEFORE_SHA" "$current" \
              | grep -E '^blogger/posts/[^/]+/[^/]+/(ko\.html|meta\.json)$' \
              | xargs -r -n1 dirname \
              | sort -u \
              | while IFS= read -r item; do
                  echo "Translating changed Post item: $item"
                  python scripts/blogger_translate_posts.py --item "$item"
                  python scripts/blogger_validate_post.py "$item" --all-locales
                done
          else
            echo "Notice/Story sources unchanged; Post translation skipped."
          fi

          cp /tmp/shiftmate-glossary.json blogger/glossary.json
          trap - EXIT

          python scripts/blogger_normalize_spacing.py blogger/faq blogger/guide blogger/posts
          python scripts/blogger_validate.py blogger/faq/*.html
          if [[ -f blogger/guide/ko.html ]]; then
            python scripts/blogger_validate_guide.py blogger/guide/*.html
          fi

          while IFS= read -r -d '' meta; do
            item="$(dirname "$meta")"
            python scripts/blogger_validate_post.py "$item" --all-locales
          done < <(find blogger/posts -mindepth 3 -maxdepth 3 -name meta.json -print0 2>/dev/null || true)

          if [[ -z "$(git status --porcelain -- blogger/faq blogger/guide blogger/posts)" ]]; then
            echo "No translation changes."
          else
            git fetch origin develop
            remote_head="$(git rev-parse origin/develop)"
            if [[ "$remote_head" != "${{ github.sha }}" ]]; then
              echo "::notice::develop advanced to $remote_head while this translation was running; stale localized output skipped."
              exit 0
            fi

            git config user.name "shiftmate-blogger-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add blogger/faq blogger/guide blogger/posts
            git commit -m "chore(blogger): update localized content"
            git push origin HEAD:develop
          fi

          if [[ "$TRANSLATE_POSTS_CHANGED" == "true" ]]; then
            if [[ -z "${BLOGGER_CLIENT_ID}" || -z "${BLOGGER_CLIENT_SECRET}" || -z "${BLOGGER_REFRESH_TOKEN}" ]]; then
              echo "::notice::Blogger OAuth secrets missing; draft sync skipped."
            else
              current="${{ github.sha }}"
              git diff --name-only "$BEFORE_SHA" "$current" \
                | grep -E '^blogger/posts/[^/]+/[^/]+/(ko\.html|meta\.json)$' \
                | xargs -r -n1 dirname \
                | sort -u \
                | while IFS= read -r item; do
                    echo "Syncing Blogger draft preview: $item"
                    python scripts/blogger_sync_draft.py --item "$item"
                  done
            fi
          fi
